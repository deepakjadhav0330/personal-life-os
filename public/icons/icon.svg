<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a18"/>
      <stop offset="100%" style="stop-color:#13131f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="135%" y2="135%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Glass card -->
  <rect x="80" y="96" width="352" height="320" rx="28" fill="url(#glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="80" y="96" width="352" height="2" rx="1" fill="rgba(255,255,255,0.22)"/>
  <!-- Accent dot grid / logo mark -->
  <circle cx="174" cy="206" r="22" fill="url(#accent)" opacity="0.95"/>
  <circle cx="256" cy="206" r="22" fill="url(#accent)" opacity="0.6"/>
  <circle cx="338" cy="206" r="22" fill="url(#accent)" opacity="0.3"/>
  <!-- Progress bar row -->
  <rect x="128" y="268" width="256" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="128" y="268" width="160" height="8" rx="4" fill="url(#accent)"/>
  <!-- Bottom bars -->
  <rect x="128" y="308" width="180" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="128" y="328" width="120" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="128" y="348" width="210" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
</svg>
