name: Update Supabase Email Template

on:
  workflow_dispatch: # manual trigger only

jobs:
  update-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check current config fields
        run: |
          curl -s \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_ID }}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); [print(k,'=',str(v)[:80]) for k,v in d.items() if 'mail' in k.lower() or 'template' in k.lower() or 'otp' in k.lower()]"

      - name: Update Magic Link email template to show OTP code
        run: |
          curl -s -X PATCH \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_ID }}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "mailer_subjects_magic_link": "Your Life OS sign-in code",
              "mailer_templates_magic_link_content": "<div style=\"font-family:sans-serif;max-width:480px;margin:0 auto;padding:24px\"><h2 style=\"color:#111\">Sign in to Life OS</h2><p style=\"color:#555\">Your sign-in code is:</p><div style=\"font-size:52px;font-weight:bold;letter-spacing:14px;color:#7c3aed;margin:16px 0\">{{ .Token }}</div><p style=\"color:#555\">Enter this code in the app. It expires in 1 hour.</p></div>"
            }' \
            | python3 -m json.tool
