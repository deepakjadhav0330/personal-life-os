<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#13102e"/>
      <stop offset="60%"  stop-color="#0a0820"/>
      <stop offset="100%" stop-color="#060612"/>
    </linearGradient>

    <!-- Outer arc gradient — bright violet -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#d8b4fe"/>
      <stop offset="30%"  stop-color="#a855f7"/>
      <stop offset="70%"  stop-color="#8b47ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Middle arc gradient — purple-indigo -->
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="40%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Inner arc gradient — indigo -->
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a5b4fc"/>
      <stop offset="50%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Center dot gradient -->
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#e0d4ff"/>
      <stop offset="100%" stop-color="#8b47ff"/>
    </radialGradient>

    <!-- Center ambient glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="52%">
      <stop offset="0%"   stop-color="rgba(110,60,230,0.38)"/>
      <stop offset="40%"  stop-color="rgba(80,50,190,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="30%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.30)"/>
    </radialGradient>

    <clipPath id="squircle">
      <rect width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Ambient glow -->
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Track rings (dim guides) -->
    <circle cx="256" cy="256" r="177" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="37"/>
    <circle cx="256" cy="256" r="124" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="33"/>
    <circle cx="256" cy="256" r="71"  fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="30"/>

    <!-- Outer arc: 300° violet arc (stroke-dasharray = circumference × 300/360) -->
    <!-- Circumference of r=177: 2π×177 ≈ 1112 → 300/360 × 1112 ≈ 927 -->
    <circle cx="256" cy="256" r="177"
      fill="none"
      stroke="url(#g1)"
      stroke-width="37"
      stroke-linecap="round"
      stroke-dasharray="927 185"
      stroke-dashoffset="278"
      transform="rotate(-90 256 256)"/>

    <!-- Middle arc: 240° purple-indigo (+40° offset) -->
    <!-- Circumference of r=124: 2π×124 ≈ 779 → 240/360 × 779 ≈ 519 -->
    <circle cx="256" cy="256" r="124"
      fill="none"
      stroke="url(#g2)"
      stroke-width="33"
      stroke-linecap="round"
      stroke-dasharray="519 260"
      stroke-dashoffset="343"
      transform="rotate(-50 256 256)"/>

    <!-- Inner arc: 175° indigo (+80° offset) -->
    <!-- Circumference of r=71: 2π×71 ≈ 446 → 175/360 × 446 ≈ 217 -->
    <circle cx="256" cy="256" r="71"
      fill="none"
      stroke="url(#g3)"
      stroke-width="30"
      stroke-linecap="round"
      stroke-dasharray="217 229"
      stroke-dashoffset="385"
      transform="rotate(-10 256 256)"/>

    <!-- Center dot -->
    <circle cx="256" cy="256" r="22" fill="url(#dot)"/>

    <!-- Specular top-edge highlight -->
    <rect x="41"  y="9"  width="430" height="9"  fill="rgba(255,255,255,0.28)" rx="4"/>
    <rect x="41"  y="18" width="430" height="7"  fill="rgba(255,255,255,0.14)" rx="3"/>

    <!-- Vignette -->
    <rect width="512" height="512" fill="url(#vignette)"/>
  </g>
</svg>
