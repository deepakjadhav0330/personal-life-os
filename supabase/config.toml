# Supabase configuration
# Update project_id when you create your project
[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "https://your-project.pages.dev"
additional_redirect_urls = ["http://localhost:5173", "https://your-project.pages.dev/**"]
jwt_expiry = 3600
enable_signup = false # Users are created by admin only
